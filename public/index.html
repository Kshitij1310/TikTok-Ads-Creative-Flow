<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="TikTok Ads Creative Setup with OAuth Integration"
    />
    <title>TikTok Ads Creative Flow</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        /* Modern TikTok-Inspired Color Palette - No Blue */
        --color-primary: #e93b5f;
        --color-primary-dark: #d32052;
        --color-primary-light: #fdf3f7;
        --color-accent: #4fb3d9;
        --color-accent-light: #e8f8fc;
        --color-success: #10b981;
        --color-success-dark: #059669;
        --color-success-light: #ecfdf5;
        --color-warning: #f59e0b;
        --color-warning-light: #fffbeb;
        --color-error: #ef4444;
        --color-error-dark: #dc2626;
        --color-error-light: #fef2f2;
        --color-text-primary: #1a1a1a;
        --color-text-secondary: #6b7280;
        --color-text-tertiary: #9ca3af;
        --color-border: #e5e7eb;
        --color-bg-primary: #ffffff;
        --color-bg-secondary: #fafafa;
        --color-bg-tertiary: #f3f4f6;
        
        --spacing-xs: 4px;
        --spacing-sm: 8px;
        --spacing-md: 12px;
        --spacing-lg: 16px;
        --spacing-xl: 24px;
        --spacing-2xl: 32px;
        --spacing-3xl: 48px;

        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 12px;

        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);

        --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        --transition-base: 200ms cubic-bezier(0.4, 0, 0.2, 1);
        --transition-slow: 300ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: linear-gradient(135deg, #f8fafb 0%, #f0f4f8 100%);
        color: var(--color-text-primary);
        line-height: 1.5;
      }

      code {
        font-family: source-code-pro, Menlo, Monaco, Consolas, 'Courier New',
          monospace;
      }

      button {
        cursor: pointer;
        font-family: inherit;
      }

      button:focus-visible {
        outline: 2px solid var(--color-primary);
        outline-offset: 2px;
      }

      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--color-primary);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
